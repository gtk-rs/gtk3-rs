[build-dependencies]
system-deps = "8"

[build-dependencies.pkg-config]
workspace = true

[dependencies]
libc = "0.2"

[dependencies.cairo-sys]
workspace = true

[dependencies.gdk-pixbuf-sys]
workspace = true

[dependencies.gio-sys]
workspace = true

[dependencies.glib-sys]
workspace = true

[dependencies.gobject-sys]
workspace = true

[dependencies.pango-sys]
workspace = true

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v3_24 = []

[lib]
name = "gdk_sys"

[package]
build = "build.rs"
description = "FFI bindings to libgdk-3"
keywords = ["gdk", "ffi", "gtk-rs", "gnome"]
links = "gdk-3"
name = "gdk-sys"

[package.authors]
workspace = true

[package.homepage]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = []
rustc-args = ["--cfg", "docsrs"]

[package.metadata.system-deps.gdk_3_0]
name = "gdk-3.0"
version = "3.22"

[package.metadata.system-deps.gdk_3_0.v3_24]
version = "3.24"
