[package]
name = "gdk"
license.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["gdk", "gtk", "gtk-rs", "gnome", "GUI"]
readme = "README.md"
documentation = "https://gtk-rs.org/gtk3-rs/stable/latest/docs/gdk/"
version.workspace = true
description = "Rust bindings for the GDK 3 library"
repository.workspace = true
exclude = [
    "gir-files/*",
]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "gdk"

[features]
v3_24 = ["gdk-sys/v3_24"]
unsafe-assume-initialized = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[dependencies]
cairo.workspace = true
gdk-pixbuf.workspace = true
gdk-sys.workspace = true
gio.workspace = true
glib.workspace = true
libc = "0.2"
pango.workspace = true

[dev-dependencies]
gir-format-check = "^0.1"
