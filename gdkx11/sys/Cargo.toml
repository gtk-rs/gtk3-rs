[package]
authors.workspace = true
description = "FFI binding for libgdkx11"
homepage.workspace = true
keywords = ["gdkx11", "ffi", "gtk-rs", "gnome"]
license.workspace = true
repository.workspace = true
name = "gdkx11-sys"
version.workspace = true
build = "build.rs"
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = []
rustc-args = ["--cfg", "docsrs"]

[package.metadata.system-deps.gdk_x11_3_0]
name = "gdk-x11-3.0"
version = "3.22"

[package.metadata.system-deps.gdk_x11_3_0.v3_24]
version = "3.24"

[package.metadata.system-deps.gdk_x11_3_0.v3_24_2]
version = "3.24.2"

[lib]
name = "gdk_x11_sys"

[dependencies]
libc = "0.2"
x11 = "2.18"

[dependencies.cairo-sys]
workspace = true

[dependencies.gdk-sys]
path = "../../gdk/sys"

[dependencies.glib-sys]
workspace = true

[build-dependencies]
system-deps = "8"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v3_24 = []
v3_24_2 = ["v3_24"]
