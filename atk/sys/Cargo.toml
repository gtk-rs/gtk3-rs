[build-dependencies]
system-deps = "8"

[dependencies]
libc = "0.2"

[dependencies.glib-sys]
workspace = true

[dependencies.gobject-sys]
workspace = true

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v2_30 = []
v2_32 = ["v2_30"]
v2_34 = ["v2_32"]
v2_38 = ["v2_34"]
v2_46 = ["v2_38"]
v2_50 = ["v2_46"]
v2_52 = ["v2_50"]

[lib]
name = "atk_sys"

[package]
build = "build.rs"
description = "FFI bindings to libatk-1"
keywords = ["atk", "ffi", "gtk-rs", "gnome"]
links = "atk-1.0"
name = "atk-sys"

[package.authors]
workspace = true

[package.homepage]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = []
rustc-args = ["--cfg", "docsrs"]

[package.metadata.system-deps.atk]
name = "atk"
version = "2.28"

[package.metadata.system-deps.atk.v2_30]
version = "2.30"

[package.metadata.system-deps.atk.v2_32]
version = "2.32"

[package.metadata.system-deps.atk.v2_34]
version = "2.34"

[package.metadata.system-deps.atk.v2_38]
version = "2.38"

[package.metadata.system-deps.atk.v2_46]
version = "2.46"

[package.metadata.system-deps.atk.v2_50]
version = "2.50"

[package.metadata.system-deps.atk.v2_52]
version = "2.52"
