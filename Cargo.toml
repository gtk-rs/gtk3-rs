[workspace]
default-members = [
  "atk",
  "atk/sys",
  "gdk",
  "gdk/sys",
  "gtk",
  "gtk/sys",
  "gtk3-macros",
  "examples",
]

members = [
  "atk",
  "atk/sys",
  "gdk",
  "gdk/sys",
  "gdkwayland",
  "gdkwayland/sys",
  "gdkx11",
  "gdkx11/sys",
  "gtk",
  "gtk/sys",
  "gtk3-macros",
  "examples",
]

exclude = ["gir", "checker"]
resolver = "2"

[workspace.dependencies]
cairo = { package = "cairo-rs", version = "0.22" }
cairo-sys = { package = "cairo-sys-rs", version = "0.22" }
gdk-pixbuf = "0.22"
gdk-pixbuf-sys = "0.22"
gio = "0.22"
gio-sys = "0.22"
glib = "0.22"
glib-build-tools = "0.22"
glib-sys = "0.22"
gobject-sys = "0.22"
pango = "0.22"
pango-sys = "0.22"
pangocairo = "0.22"
